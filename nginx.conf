server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Compressions Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    # En-têtes de sécurité
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Caching agressif sur les fichiers statiques (images, JS, CSS)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|avif|webp)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Fichiers sitemap et robots.txt
    location = /sitemap.xml {
        try_files $uri /sitemap.xml =404;
    }

    location = /robots.txt {
        try_files $uri /robots.txt =404;
    }

    # SPA Router Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Sécurité : bloquer les fichiers cachés
    location ~ /\. {
        deny all;
    }
}
